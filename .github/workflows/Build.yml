name: J6Plus Kernel Build
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04 # Daha uyumlu olması için 20.04'e çektim
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: upstream/3.18.140-stable

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex git-core gnupg gperf libsdl1.2-dev libwxgtk3.0-gtk3-dev squashfs-tools zip curl libncurses5-dev zlib1g-dev lib32z1-dev lib32ncurses5-dev x11proto-core-dev libx11-dev libgl1-mesa-dev libxml2-utils xsltproc unzip m4 python3 python3-pip libssl-dev

      - name: Install Toolchain
        run: |
          git clone https://github.com/lineageos/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 -b lineage-17.1 toolchain

      - name: Compile Kernel
        run: |
          export ARCH=arm
          export CROSS_COMPILE=$(pwd)/toolchain/bin/arm-linux-androideabi-
          make j6primelte_defconfig
          make -j$(nproc)

      - name: Upload Kernel Result
        uses: actions/upload-artifact@v4
        with:
          name: J6Plus-Overclock-Kernel
          path: arch/arm/boot/zImage-dtb
