name: Kernel Build (1.6 GHz Overclock)
on:
  push:
    branches: [ main, master ] # Hangi branch ismini kullanıyorsan onu yaz
  workflow_dispatch: # Manuel başlatma butonu ekler

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex git-core gnupg gperf libsdl1.2-dev libesd0-dev libwxgtk3.0-gtk3-dev squashfs-tools zip curl libncurses5-dev zlib1g-dev lib32z1-dev lib32ncurses5-dev x11proto-core-dev libx11-dev libgl1-mesa-dev libxml2-utils xsltproc unzip m4 python3 python3-pip libssl-dev

      - name: Install Toolchain (GCC 4.9)
        run: |
          git clone https://github.com/lineageos/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 -b lineage-17.1 toolchain-32
          git clone https://github.com/lineageos/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 -b lineage-17.1 toolchain-64

      - name: Compile Kernel
        run: |
          export ARCH=arm
          export CROSS_COMPILE=$(pwd)/toolchain-32/bin/arm-linux-androideabi-
          make msm8917_defconfig # Eğer dosya adın farklıysa onu yaz
          make -j$(nproc)

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Overclocked-Kernel-J6Plus
          path: arch/arm/boot/zImage-dtb # Veya Image.gz-dtb
